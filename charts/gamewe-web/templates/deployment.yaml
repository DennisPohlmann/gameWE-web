apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gamewe-web.fullname" . }}
  labels:
    {{- include "gamewe-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gamewe-web.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gamewe-web.selector" . | nindent 8 }}
      {{- if or (and (not .Values.existingSecret) .Values.secretEnv) .Values.podAnnotations }}
      annotations:
        {{- if and (not .Values.existingSecret) .Values.secretEnv }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # The root file system is read-only: BASE_PATH is written into a copy
      # of server.js and .next (scripts/set-base-path.sh), which the web
      # container mounts over the ones of the image.
      initContainers:
        - name: base-path
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["sh", "-c", 'cp -a /app/server.js /app/.next /work/ && exec /app/scripts/set-base-path.sh "${BASE_PATH:-}" /work']
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: app
              mountPath: /work
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if or .Values.existingSecret .Values.secretEnv }}
          envFrom:
            - secretRef:
                name: {{ include "gamewe-web.secretName" . }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ include "gamewe-web.healthz" . }}
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ include "gamewe-web.healthz" . }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: app
              mountPath: /app/server.js
              subPath: server.js
            - name: app
              mountPath: /app/.next
              subPath: .next
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: content
              mountPath: /var/lib/gamewe/web
            {{- end }}
      volumes:
        - name: app
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: content
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "gamewe-web.fullname" .) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

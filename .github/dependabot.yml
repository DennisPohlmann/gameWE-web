# .github/dependabot.yml - gameWE web
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev:
        dependency-type: development
        update-types: [minor, patch]
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

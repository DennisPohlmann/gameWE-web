name: build

# Every push (any branch) and every pull request type checks, tests and
# builds, scans the image with Trivy and builds everything a release ships:
# the package (workflow artifact for 7 days), the Helm chart (helm package)
# and the image. A push to main also publishes the image as
# ghcr.io/dennispohlmann/gamewe-web:edge, and so does the weekly run
# (schedule), to take in the Alpine updates of apk upgrade without waiting
# for a commit. Nothing else is published then: no tag, no GitHub release, no
# semantic-release.
#
# A release is only made by hand: Actions -> build -> Run workflow on main
# with "release" ticked, or `gh workflow run build.yml --ref main -f
# release=true`. check and image-scan run first (a fixable HIGH or CRITICAL
# vulnerability stops the release); only when they passed does
# semantic-release read the Conventional Commits since the last tag: for a
# feat, fix or breaking change it bumps the version files, writes
# CHANGELOG.md, commits that as "chore(release): vX.Y.Z [skip ci]", tags
# vX.Y.Z and creates the GitHub release as a draft. package and image then
# build that tag, add the archive to the release and push the image tags
# <version>, <major>.<minor> and latest, and the Helm chart charts/gamewe-web
# (its version set by semantic-release) goes to oci://ghcr.io/<owner>/charts
# and into the release. publish makes the draft public once everything is in
# it, so a release never shows up without its files. docs, chore, ci etc.
# make no release.
on:
  push:
    # every branch except Dependabot's: its pull request builds them anyway
    branches: ['**', '!dependabot/**']
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      release:
        description: Make a release (semantic-release, tag, GitHub release, versioned image and chart)
        type: boolean
        default: false

# A newer push or pull request update cancels the older check run; manual
# runs (and so releases) and the weekly run are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  IMAGE: ghcr.io/${{ github.repository_owner }}/gamewe-web

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - name: type check
        run: npm run lint
      - name: tests
        run: npm test
      - name: build
        run: npm run build
      - uses: ./.github/actions/setup-helm
      - name: helm chart
        run: |
          helm lint charts/gamewe-web --strict
          helm template gamewe charts/gamewe-web --set secretEnv.ADMIN_SECRET=x --set ingress.enabled=true --set persistence.enabled=true > /dev/null
          helm package charts/gamewe-web --destination "$RUNNER_TEMP/chart"

  # Builds the image without pushing it and scans it: HIGH or CRITICAL
  # vulnerabilities that have a fix fail, and so do HIGH or CRITICAL
  # misconfigurations of the Dockerfile. Findings accepted on purpose go into
  # .trivyignore with a reason and an expiry date.
  image-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-trivy
      - name: scan the Dockerfile
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 .
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: gamewe-web:scan
          cache-from: type=gha
      - name: scan the image
        run: >-
          trivy image --scanners vuln --ignore-unfixed
          --severity HIGH,CRITICAL --exit-code 1 gamewe-web:scan

  release:
    needs: [check, image-scan]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: releases only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::a release can only be made from main, not from $GITHUB_REF"
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags and commits since the last release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/changelog@7.0.0
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release

  # Runs after the release job (or without it when there is no release) and
  # builds the new tag if there was a release, otherwise the pushed commit.
  package:
    needs: [check, image-scan, release]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.image-scan.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version != '' && format('v{0}', needs.release.outputs.version) || github.sha }}
          fetch-depth: 0 # tags, for the version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@latest
      - name: make package
        run: make package
      - uses: actions/upload-artifact@v7
        with:
          name: gamewe-web-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: add the archive to the release
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$RELEASE" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"

  # A release also publishes the Helm chart (charts/gamewe-web, its version
  # set to the release by semantic-release): as an OCI artifact
  # oci://ghcr.io/<owner>/charts/gamewe-web and as a file in the release.
  chart:
    needs: [release, package]
    if: needs.release.outputs.version != '' && needs.package.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: ./.github/actions/setup-helm
      - name: package and publish the chart
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -qx "version: $RELEASE" charts/gamewe-web/Chart.yaml
          mkdir -p dist
          helm package charts/gamewe-web --destination dist
          echo "$REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/gamewe-web-$RELEASE.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          gh release upload "v$RELEASE" "dist/gamewe-web-$RELEASE.tgz" --clobber --repo "$GITHUB_REPOSITORY"

  # Publishes edge on a push to main and on the weekly schedule, and on a
  # release the version tags (after the package is in the draft release),
  # with an SBOM and full provenance as attestations; a release also gets
  # the SBOM as an SPDX file. Pushes to other branches and manual runs
  # without release build the image without pushing it; a pull request
  # stops at image-scan.
  image:
    needs: [check, image-scan, release, package]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.check.result == 'success' && needs.image-scan.result == 'success' && needs.release.result != 'failure' && needs.package.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write # the SBOM file in the release
      packages: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
      PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || needs.release.outputs.version != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version != '' && format('v{0}', needs.release.outputs.version) || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=v${{ env.RELEASE }},enable=${{ env.RELEASE != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.RELEASE }},enable=${{ env.RELEASE != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE != '' }}
          flavor: latest=false
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.RELEASE || format('edge+{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: ./.github/actions/setup-trivy
        if: env.RELEASE != ''
      - name: add the SBOM to the release
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          sbom="dist/gamewe-web-$RELEASE-image.spdx.json"
          mkdir -p dist
          trivy image --format spdx-json --output "$sbom" "${IMAGE,,}:$RELEASE"
          gh release upload "v$RELEASE" "$sbom" --clobber --repo "$GITHUB_REPOSITORY"

  # The release stays a draft until the archive, the chart and the image SBOM
  # are in it; then it is published. A failed job leaves the draft: re-run
  # the failed jobs of this run (the uploads replace what is already there).
  publish:
    needs: [release, package, chart, image]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - name: publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$RELEASE" --draft=false --latest --repo "$GITHUB_REPOSITORY"

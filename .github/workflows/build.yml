name: build

# Every push to main checks, builds the package (workflow artifact) and
# publishes the image as ghcr.io/dennispohlmann/gamewe-web:edge.
# semantic-release then reads the Conventional Commits since the last tag:
# for a feat, fix or breaking change it bumps the version files, writes
# CHANGELOG.md, commits that as "chore(release): vX.Y.Z [skip ci]", tags
# vX.Y.Z and creates the GitHub release; package and image then build that
# tag, add the archive to the release and push the image tags <version>,
# <major>.<minor> and latest. A manual run builds without publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  IMAGE: ghcr.io/${{ github.repository_owner }}/gamewe-web

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - name: type check
        run: npm run lint
      - name: tests
        run: npm test
      - name: build
        run: npm run build

  release:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags and commits since the last release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/changelog@7.0.0
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release

  # Runs after the release job (or without it on a manual run) and builds the
  # new tag if there was a release, otherwise the pushed commit.
  package:
    needs: [check, release]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version != '' && format('v{0}', needs.release.outputs.version) || github.sha }}
          fetch-depth: 0 # tags, for the version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@latest
      - name: make package
        run: make package
      - uses: actions/upload-artifact@v7
        with:
          name: gamewe-web-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
      - name: add the archive to the release
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$RELEASE" dist/*.tar.gz dist/*.tar.gz.sha256 --repo "$GITHUB_REPOSITORY"

  image:
    needs: [check, release]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version != '' && format('v{0}', needs.release.outputs.version) || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=v${{ env.RELEASE }},enable=${{ env.RELEASE != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.RELEASE }},enable=${{ env.RELEASE != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE != '' }}
          flavor: latest=false
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.RELEASE || format('edge+{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Bug report
description: Something in gameWE - web does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Security problems do not
        belong here**: please report them privately as described in
        [SECURITY.md](https://github.com/DennisPohlmann/gameWE-web/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: "The version of gameWE - web you use (the release you installed, e.g. 1.5.3, from the package name or the Docker image tag)."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Browser and setup"
      placeholder: "e.g. Firefox 140 on Android, skin \"modern-dark\", Docker quick start or the tar.gz package, MariaDB / PostgreSQL / SQL Server"
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game
      description: Which game is affected, if any.
      placeholder: e.g. CS 1.6, CS:S, CS:GO, CS2
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs and configuration
      description: "Server output (`journalctl -u gamewe-web` or `docker compose logs web`) and any errors in the browser console."
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I removed passwords, RCON passwords, tokens and other private data from the logs and configs above.
          required: true
